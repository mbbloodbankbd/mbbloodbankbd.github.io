<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Blood Bank</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #d9534f;
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 85%;
        }
        button:hover {
            background-color: #c9302c;
        }
        .result-box {
            margin-top: 20px;
            text-align: left;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #d9534f;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MB Blood Bank</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">রক্তের গ্রুপ লিখে সার্চ করুন</p>
        
        <input type="text" id="bloodGroupInput" placeholder="যেমন: A+, B+, O+">
        <br>
        <button onclick="searchBlood()">রক্তদাতা খুঁজুন</button>

        <div id="resultContainer" class="result-box">
            <strong>ফলাফল:</strong>
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        // ডেমো ডাটাবেস (রক্তদাতাদের তালিকা)
        const donors = [
            { name: "রহিম উদ্দিন", group: "A+", phone: "01700000000", location: "ঢাকা" },
            { name: "করিম আহমেদ", group: "B+", phone: "01800000000", location: "চট্টগ্রাম" },
            { name: "শরিফুল ইসলাম", group: "O+", phone: "01900000000", location: "সিলেট" },
            { name: "হাসান মাহমুদ", group: "AB+", phone: "01600000000", location: "রাজশাহী" }
        ];

        function searchBlood() {
            const inputVal = document.getElementById('bloodGroupInput').value.trim().toUpperCase();
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            if (inputVal === "") {
                alert("দয়া করে রক্তের গ্রুপ লিখুন!");
                return;
            }

            // রক্তদাতা খোঁজার লজিক
            const matchedDonors = donors.filter(donor => donor.group === inputVal);

            resultContainer.style.display = "block";
            if (matchedDonors.length > 0) {
                let html = "";
                matchedDonors.forEach(donor => {
                    html += `<br>নাম: ${donor.name}<br>গ্রুপ: ${donor.group}<br>ফোন: ${donor.phone}<br>ঠিকানা: ${donor.location}<hr>`;
                });
                resultText.innerHTML = html;
            } else {
                resultText.innerHTML = "দুঃখিত, এই গ্রুপের কোনো রক্তদাতা এই মুহূর্তে পাওয়া যায়নি।";
            }
        }
    </script>

</body>
</html>
