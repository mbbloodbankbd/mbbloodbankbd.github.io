<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Blood Bank - লাইভ ব্লাড ফাইন্ডার</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e63946">

    <style>
        :root {
            --primary-color: #e63946;
            --secondary-color: #1d3557;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 15px;
            color: var(--secondary-color);
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        select:focus, input:focus {
            border-color: var(--primary-color);
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #d62828;
        }
        .donor-list {
            margin-top: 15px;
        }
        .donor-item {
            background: #f1faee;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .donor-info h4 {
            font-size: 16px;
            color: var(--secondary-color);
        }
        .donor-info p {
            font-size: 13px;
            color: #666;
        }
        .blood-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .call-btn {
            background: #2a9d8f;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- অ্যাপ হেডার -->
        <header>
            <h1>🩸 MB Blood Bank</h1>
            <p>আপনার জরুরি রক্তের প্রয়োজনে পাশে আছি</p>
        </header>

        <!-- রক্ত খোঁজার সেকশন -->
        <div class="card">
            <h3>রক্তদাতা খুঁজুন</h3>
            <div class="form-group">
                <label for="searchGroup">রক্তের গ্রুপ নির্বাচন করুন:</label>
                <select id="searchGroup" onchange="filterDonors()">
                    <option value="all">সকল গ্রুপ</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <div class="donor-list" id="donorContainer">
                <!-- ডোনারদের তালিকা এখানে ডাইনামিক দেখাবে -->
            </div>
        </div>

        <!-- নতুন ডোনার রেজিস্ট্রেশন সেকশন -->
        <div class="card">
            <h3>নতুন রক্তদাতা হিসেবে যুক্ত হোন</h3>
            <div class="form-group">
                <label for="donorName">আপনার নাম:</label>
                <input type="text" id="donorName" placeholder="পূর্ণ নাম লিখুন">
            </div>
            <div class="form-group">
                <label for="donorGroup">রক্তের গ্রুপ:</label>
                <select id="donorGroup">
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label for="donorPhone">মোবাইল নম্বর:</label>
                <input type="text" id="donorPhone" placeholder="০১৭xxxxxxxx">
            </div>
            <button class="btn" onclick="addDonor()">তালিকাভুক্ত হোন</button>
        </div>
    </div>

    <script>
        // স্যাম্পল বা প্রারম্ভিক ডোনার ডাটা
        let donors = [
            { name: "রহিম উদ্দিন", group: "A+", phone: "01711112222" },
            { name: "করিম আহমেদ", group: "O+", phone: "01822223333" },
            { name: "ফাতেমা বেগম", group: "B+", phone: "01933334444" }
        ];

        function displayDonors(list) {
            const container = document.getElementById('donorContainer');
            container.innerHTML = '';
            
            if(list.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">কোনো রক্তদাতা পাওয়া যায়নি।</p>';
                return;
            }

            list.forEach(donor => {
                container.innerHTML += `
                    <div class="donor-item">
                        <div class="donor-info">
                            <h4>${donor.name}</h4>
                            <p>মোবাইল: ${donor.phone}</p>
                            <a href="tel:${donor.phone}" class="call-btn">📞 কল করুন</a>
                        </div>
                        <div class="blood-badge">${donor.group}</div>
                    </div>
                `;
            });
        }

        function filterDonors() {
            const selectedGroup = document.getElementById('searchGroup').value;
            if(selectedGroup === 'all') {
                displayDonors(donors);
            } else {
                const filtered = donors.filter(d => d.group === selectedGroup);
                displayDonors(filtered);
            }
        }

        function addDonor() {
            const name = document.getElementById('donorName').value;
            const group = document.getElementById('donorGroup').value;
            const phone = document.getElementById('donorPhone').value;

            if(!name || !phone) {
                alert('দয়া করে নাম এবং মোবাইল নম্বর পূরণ করুন।');
                return;
            }

            donors.push({ name, group, phone });
            alert('ধন্যবাদ! সফলভাবে রক্তদাতা হিসেবে যুক্ত হয়েছেন।');
            
            // ইনপুট ফিল্ড খালি করা
            document.getElementById('donorName').value = '';
            document.getElementById('donorPhone').value = '';
            
            filterDonors();
        }

        // প্রথমে সকল ডোনার লোড করা
        displayDonors(donors);
    </script>
</body>
</html>
