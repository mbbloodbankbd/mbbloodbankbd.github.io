<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MB Blood Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a centered phone frame on desktop, full-screen on phones. Liquid glass cards over soft crimson blobs, 3D pressable buttons. */
:root{
  --red:#d3153a; --red-deep:#7d0b25; --rose:#ff6b85; --ink:#2a1218; --muted:#7b5a62;
  --bg:#fff1f3; --glass:rgba(255,255,255,.62); --line:rgba(255,255,255,.75); --ok:#12805c; --warn:#b86a00;
  --font:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#2b0a13;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #ff9db0;outline-offset:2px}
.phone{position:relative;width:100%;max-width:410px;height:100%;max-height:860px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;border-radius:0}
@media (min-width:520px){.phone{height:min(860px,96%);border-radius:38px;box-shadow:0 0 0 10px #12050a,0 30px 80px rgba(0,0,0,.55)}}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none}
.b1{width:260px;height:260px;background:#ff7f96;top:-70px;right:-80px}
.b2{width:240px;height:240px;background:#ffc2cd;bottom:120px;left:-90px}
.b3{width:180px;height:180px;background:#ff9d63;opacity:.28;top:42%;right:-60px}
.screen{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 96px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
header.top{position:relative;display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
header.top h1{font-size:19px;font-weight:700;flex:1;text-wrap:balance}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);box-shadow:0 4px 14px rgba(125,11,37,.12);position:relative}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(125,11,37,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.card{padding:14px;margin-bottom:12px}
.hero{padding:18px;margin:4px 0 14px;color:#fff;border-radius:26px;background:radial-gradient(120% 120% at 0% 0%,#ff5a78 0%,#d3153a 45%,#7d0b25 100%);box-shadow:0 16px 34px rgba(125,11,37,.38),inset 0 2px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-40px;top:-50px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 65%)}
.hero h2{font-size:20px;font-weight:700;position:relative;text-wrap:balance}
.hero p{opacity:.92;font-size:13.5px;margin-top:2px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:16px;font-weight:600;color:#fff;background:linear-gradient(180deg,#ff4a6b,#c80f34 60%,#a60b2a);box-shadow:0 6px 0 #6e0720,0 12px 22px rgba(125,11,37,.35),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6e0720,0 5px 10px rgba(125,11,37,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.block{width:100%}
.btn.ghost{color:var(--red-deep);background:linear-gradient(180deg,#fff,#ffe3e8);box-shadow:0 5px 0 #e7b3be,0 10px 18px rgba(125,11,37,.15),inset 0 1px 0 #fff}
.btn.ghost:active{box-shadow:0 1px 0 #e7b3be}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:12px;box-shadow:0 4px 0 #6e0720,0 8px 14px rgba(125,11,37,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.sm.ghost{box-shadow:0 3px 0 #e7b3be}
.btn.ok{background:linear-gradient(180deg,#2fbf8f,#12805c);box-shadow:0 4px 0 #0a4f39,0 8px 14px rgba(18,128,92,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.dark{background:linear-gradient(180deg,#5b3a43,#2a1218);box-shadow:0 4px 0 #12060a,0 8px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--red-deep)}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--red)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
.sec h3{font-size:16px;font-weight:700}
.link{color:var(--red);font-weight:600;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;font-weight:500;line-height:1.25}
.tile i{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;color:var(--red-deep);background:linear-gradient(160deg,#fff,#ffd9e0);box-shadow:0 6px 0 #efb5c1,0 12px 18px rgba(125,11,37,.16),inset 0 1px 0 #fff;transition:transform .08s,box-shadow .08s}
.tile:active i{transform:translateY(4px);box-shadow:0 2px 0 #efb5c1}
.tile.hot i{color:#fff;background:linear-gradient(160deg,#ff5a78,#b30d2f);box-shadow:0 6px 0 #6e0720,0 12px 18px rgba(125,11,37,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:52px;height:38px;padding:0 12px;border-radius:13px;font-weight:700;background:var(--glass);border:1px solid var(--line);color:var(--red-deep);box-shadow:0 3px 0 #efb5c1}
.chip[aria-pressed=true]{color:#fff;background:linear-gradient(180deg,#ff4a6b,#b30d2f);border-color:transparent;box-shadow:0 3px 0 #6e0720}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:44px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.85);border:1.5px solid #f0c9d1;width:100%}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:6px 0 14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--red)}
.donor{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;background:radial-gradient(circle at 30% 25%,#ff8aa0,#b30d2f);box-shadow:0 4px 10px rgba(125,11,37,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.avatar.lg{width:76px;height:76px;font-size:26px}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600}
.grow small{display:block;color:var(--muted);font-size:12.5px}
.bg{font-weight:700;color:var(--red);font-size:18px;min-width:38px;text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#fde0e6;color:var(--red-deep)}
.pill.ok{background:#d8f3e8;color:var(--ok)}
.pill.warn{background:#ffe9c7;color:var(--warn)}
.pill.off{background:#e9e2e4;color:#6b5a5f}
.pill.crit{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
nav.bar{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:26px;background:rgba(255,255,255,.72);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:0 14px 34px rgba(125,11,37,.28),inset 0 1px 0 #fff;z-index:5}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:20px;font-size:12.5px;font-weight:700;line-height:1.2;color:#4a1f2b;position:relative}
nav.bar button[aria-current=page]{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);background:linear-gradient(180deg,#ff4a6b,#b30d2f);box-shadow:0 4px 0 #6e0720,0 8px 14px rgba(125,11,37,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.badge{position:absolute;top:2px;right:18%;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.scrim{position:absolute;inset:0;background:rgba(42,18,24,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;background:#fff7f8;border-radius:28px 28px 0 0;padding:18px 16px 24px;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet h3{font-size:18px;margin-bottom:10px}
.grab{width:40px;height:5px;border-radius:3px;background:#e4c3ca;margin:-6px auto 12px}
.toast{position:absolute;left:16px;right:16px;top:14px;z-index:20;padding:12px 14px;border-radius:16px;background:#2a1218;color:#fff;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.btn,.tile i{transition:none}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.seg button{min-height:38px;padding:0 10px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected=true]{background:linear-gradient(180deg,#ff4a6b,#b30d2f);color:#fff;box-shadow:0 3px 0 #6e0720}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid rgba(211,21,58,.1);font-weight:500}
.menu button:last-child{border:0}
.menu .ic{color:var(--red)}
.menu .chev{margin-left:auto;color:#c9a0aa}
.switch{position:relative;width:54px;height:32px;border-radius:16px;background:#d8c5ca;transition:background .15s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]:after{transform:translateX(22px)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;font-size:13px}
.bar span{height:12px;border-radius:6px;background:linear-gradient(90deg,#ff7f96,#c80f34);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(211,21,58,.18);font-size:14px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.cert{padding:20px 16px;text-align:center;border-radius:20px;background:linear-gradient(160deg,#fffdf6,#fff0d8);border:3px double #c8942e;color:#4a2a0b}
.cert h4{font-size:22px;color:#8a5a0a;margin-bottom:2px}
.cert .nm{font-size:26px;font-weight:700;margin:8px 0;color:var(--red-deep)}
.chat{display:flex;flex-direction:column;gap:8px;height:240px;overflow:auto;padding:4px 2px;margin-bottom:10px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;font-size:14px}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#ff4a6b,#c80f34);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid #f0c9d1;border-bottom-left-radius:4px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}
.map{width:100%;border-radius:20px;background:#fde9ed;border:1px solid var(--line);display:block}
.login{position:relative;flex:1;overflow:auto;padding:26px 20px 24px;display:flex;flex-direction:column}
.logo{width:92px;height:92px;border-radius:30px;margin:0 auto 12px;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 20%,#ff8aa0,#c80f34 55%,#7d0b25);box-shadow:0 16px 30px rgba(125,11,37,.4),inset 0 3px 0 rgba(255,255,255,.45)}
.logo svg{width:50px;height:50px;fill:#fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.login h1{text-align:center;font-size:26px;text-wrap:balance}
.login .sub{text-align:center;color:var(--muted);margin:2px 0 20px}
.proto{position:absolute;left:0;right:0;top:0;text-align:center;font-size:11px;padding:3px;background:#2a1218;color:#ffd9e0;z-index:30}
.top .bellb{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.top .iconbtn{flex:none}
.top{gap:8px}
.drawer{width:82%;max-width:320px;height:100%;background:#fff7f8;padding:18px 12px 24px;overflow:auto;box-shadow:12px 0 40px rgba(0,0,0,.3);border-radius:0 28px 28px 0;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:18px}
.drawer .menu button{font-size:15px;padding:12px}
.drawer hr{border:0;border-top:1px solid rgba(211,21,58,.14);margin:6px 0}

header.top.home{align-items:flex-end;padding-top:8px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who small{font-size:13px;color:var(--muted);font-weight:500}
.who b{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sky{position:relative;height:98px;margin-bottom:2px}
.kite{position:absolute;left:0;bottom:24px;width:72px;height:72px;transform-origin:50% 60%;animation:fly 9s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(125,11,37,.3))}
@keyframes fly{0%{transform:translate(0,8px) rotate(-6deg)}18%{transform:translate(30px,-2px) rotate(4deg)}42%{transform:translate(74px,-12px) rotate(-3deg)}68%{transform:translate(46px,-2px) rotate(6deg)}100%{transform:translate(0,8px) rotate(-6deg)}}
.trail{display:flex;align-items:center;gap:8px;flex:none}
.meav{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;background:radial-gradient(circle at 30% 25%,#ff8aa0,#b30d2f);border:2px solid #fff;box-shadow:0 5px 12px rgba(125,11,37,.35)}
.meav img,.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.meav .ic{width:22px;height:22px}
.btn.sq{width:40px;min-width:40px;padding:0;flex:none}
.car{position:relative;margin:2px 0 14px;border-radius:26px;box-shadow:0 16px 34px rgba(125,11,37,.3)}
.car-track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:26px}
.car-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:flex;align-items:center;gap:6px;height:172px;padding:14px 8px 34px 18px;color:#fff;position:relative;overflow:hidden}
.slide .txt{flex:1;min-width:0}
.slide h3{font-size:18px;font-weight:700;line-height:1.25;text-wrap:balance}
.slide p{font-size:13px;opacity:.93;margin:3px 0 10px}
.slide .art{width:124px;height:124px;flex:none;overflow:hidden}
.slide .art svg{width:100%;height:100%;display:block}
.s1{background:radial-gradient(120% 120% at 0% 0%,#ff5a78,#c80f34 50%,#7d0b25)}
.s2{background:linear-gradient(135deg,#8c1130,#3a0614)}
.s3{background:linear-gradient(135deg,#d9480f,#9c0b2a)}
.s4{background:linear-gradient(135deg,#4a2a33,#1d0b10)}
.s5{background:linear-gradient(135deg,#a3154f,#4a0a2c)}
.dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:0;pointer-events:none}
.dots button{width:24px;height:24px;display:grid;place-items:center;pointer-events:auto}
.dots button:after{content:"";width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.5);transition:width .2s,background .2s}
.dots button[aria-current=true]:after{width:20px;background:#fff}
.car-nav{position:absolute;bottom:6px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;z-index:2}
.car-nav.prev{left:10px}.car-nav.next{right:10px}
.car-nav .ic{width:16px;height:16px;stroke-width:2.4}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
.ecg{stroke-dasharray:120;animation:ecg 2.2s linear infinite}
@keyframes ecg{from{stroke-dashoffset:120}to{stroke-dashoffset:-120}}
.rg{transform-box:fill-box;transform-origin:center;opacity:0;animation:rg 2.8s ease-out infinite}
.rg.d1{animation-delay:.9s}.rg.d2{animation-delay:1.8s}
@keyframes rg{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4.2);opacity:0}}
.pin{transform-box:fill-box;transform-origin:center;animation:pop 2.8s ease-in-out infinite}
.pin.p2{animation-delay:.5s}.pin.p3{animation-delay:1s}
@keyframes pop{0%,12%{transform:scale(0)}28%{transform:scale(1.15)}38%,85%{transform:scale(1)}100%{transform:scale(0)}}
.sir{transform-origin:60px 60px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alr{transform-box:fill-box;transform-origin:center;animation:alr 1.3s ease-out infinite}
@keyframes alr{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.8);opacity:0}}
.amb{animation:drive 4.6s linear infinite}
@keyframes drive{0%{transform:translateX(-100px)}100%{transform:translateX(150px)}}
.road line{animation:road .6s linear infinite}
@keyframes road{to{stroke-dashoffset:-26}}
.lt{animation:fl .5s steps(1) infinite}
@keyframes fl{0%{fill:#ff2d55}50%{fill:#4d8dff}}
.hrt{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
.coin{opacity:0;animation:coin 2.4s ease-in infinite}
.coin.c2{animation-delay:.8s}.coin.c3{animation-delay:1.6s}
@keyframes coin{0%{transform:translateY(-16px);opacity:0}20%{opacity:1}70%{transform:translateY(30px);opacity:1}100%{transform:translateY(42px);opacity:0}}
@media (prefers-reduced-motion:reduce){.kite,.beat,.ecg,.rg,.pin,.sir,.alr,.amb,.road line,.lt,.hrt,.coin{animation:none}.rg{opacity:.4}.pin{transform:none}.coin{opacity:1}.amb{transform:translateX(20px)}}
.kite img{width:100%;height:100%;display:block}
.biglogo{width:min(210px,58%);height:auto;display:block;margin:0 auto 6px;animation:lgfloat 5s ease-in-out infinite alternate;filter:drop-shadow(0 10px 10px rgba(125,11,37,.25))}
@keyframes lgfloat{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.inl{display:flex;gap:8px;align-items:stretch}
.inl input{flex:1;min-width:0}
.inl .btn{min-height:44px;padding:0 14px;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.newacc{display:block;width:100%;margin-top:14px;text-align:center;font-weight:600;color:var(--red-deep);min-height:44px}
@media (prefers-reduced-motion:reduce){.kstr,.biglogo{animation:none}}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.lpic{display:block;width:100%;max-width:240px;height:98px;margin:0 auto 10px}
.lpic *{transform-box:fill-box;transform-origin:center}
.lp-float{animation:lpf 3s ease-in-out infinite alternate}
@keyframes lpf{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.lp-dot{animation:lpd 1.8s ease-in-out infinite}
.lp-dot.d1{animation-delay:.25s}.lp-dot.d2{animation-delay:.5s}.lp-dot.d3{animation-delay:.75s}
@keyframes lpd{0%,100%{opacity:.25}35%,70%{opacity:1}}
.lp-badge{animation:lpb 2.2s ease-in-out infinite}
@keyframes lpb{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.lp-wave{animation:lpw 1.8s ease-in-out infinite}.lp-wave.r{animation-delay:.6s}
@keyframes lpw{0%,100%{opacity:.2}50%{opacity:1}}
.enter{position:absolute;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 50% 100%,#ffc2cd,#fff1f3 60%);animation:enbg 2.3s ease-in-out forwards}
@keyframes enbg{0%,62%{opacity:1}100%{opacity:0}}
.enter .ek{position:absolute;left:50%;top:50%;width:132px;height:auto;margin:-66px 0 0 -66px;filter:drop-shadow(0 14px 14px rgba(125,11,37,.35));animation:enk 2.3s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes enk{0%{transform:translate(-190px,320px) rotate(-18deg) scale(.5);opacity:0}14%{opacity:1}40%{transform:translate(-50px,70px) rotate(8deg) scale(1.25)}62%{transform:translate(30px,-20px) rotate(-6deg) scale(1.45)}100%{transform:translate(230px,-440px) rotate(14deg) scale(.8);opacity:0}}
.enter p{position:absolute;bottom:20%;font-weight:700;font-size:24px;color:var(--red-deep);opacity:0;animation:ent 2.3s ease forwards}
@keyframes ent{0%,25%{opacity:0;transform:translateY(10px)}45%,70%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lpic *,.enter,.enter *{animation:none!important}.enter p{opacity:1}}
</style>

const carIdx=()=>{const t=$('#car');return t?Math.round(t.scrollLeft/Math.max(t.clientWidth,1)):0};
function carGo(i){const t=$('#car');if(!t)return;const n=t.children.length;i=((i%n)+n)%n;t.scrollTo({left:i*t.clientWidth,behavior:RM?'auto':'smooth'})}
function initCar(){clearInterval(carT);const t=$('#car');if(!t)return;const box=t.parentElement;const dots=[...box.querySelectorAll('.dots button')];
 const upd=()=>{const i=carIdx();dots.forEach((d,k)=>d.setAttribute('aria-current',String(k===i)))};
 t.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});upd();
 ['pointerdown','focusin','mouseenter','touchstart'].forEach(e=>box.addEventListener(e,()=>{carPause=true},{passive:true}));
 ['mouseleave','focusout','touchend','pointerup'].forEach(e=>box.addEventListener(e,()=>{carPause=false},{passive:true}));
 t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){carGo(carIdx()+1);e.preventDefault()}if(e.key==='ArrowLeft'){carGo(carIdx()-1);e.preventDefault()}});

function QRsvg(seed,size=180){
 let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
 const n=21,cell=size/n;let out='';
 const fin=(x,y)=>{const inF=(a,b)=>(a<7&&b<7)||(a>=n-7&&b<7)||(a<7&&b>=n-7);return inF(x,y)};
 const finVal=(x,y)=>{const f=(a,b)=>{const dx=Math.min(a,6-a),dy=Math.min(b,6-b);const m=Math.min(dx,dy);return m===0||m===2};
  if(x<7&&y<7)return f(x,y);if(x>=n-7&&y<7)return f(x-(n-7),y);return f(x,y-(n-7))};
 let s=h||1;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  let on;if(fin(x,y))on=finVal(x,y);else{s=(s*1664525+1013904223)>>>0;on=(s>>>16)&1}
  if(on)out+=`<rect x="${(x*cell).toFixed(2)}" y="${(y*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`}
 return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="QR Code (ডেমো)" fill="#2a1218" style="background:#fff;padding:8px;border-radius:16px;box-sizing:content-box">${out}</svg>`;
}

 reqst(v){const[i,s]=v.split('|');const r=S.requests.find(x=>x.id==i);r.status=s;if(s==='approved'){const m=S.donors.filter(d=>d.bg===r.bg&&d.dist===r.dist&&eligible(d)).length;S.notes.unshift({t:'জরুরি',m:r.hospital+'-এ '+r.bg+' রক্ত প্রয়োজন ('+bn(r.bags)+' ব্যাগ)।',d:'এইমাত্র',u:1,k:'req'});toast('অনুমোদিত। '+bn(m)+' জন প্রস্তুত দাতাকে নোটিফিকেশন যাবে।')}else toast(s==='closed'?'অনুরোধ সম্পন্ন হিসেবে চিহ্নিত।':'অনুরোধ বাতিল।');render(true)},
 ambDel(v){S.amb.splice(+v,1);render(true)},
 aidst(v){const[i,s]=v.split('|');const a=S.aid.find(x=>x.id==i);a.status=s;if(s==='approved'){S.fund.out+=a.amt;S.fund.ledger.unshift({d:fdate(TODAY),t:'সাহায্য: '+a.why,a:a.amt,k:'out'})}render(true);toast(s==='approved'?'অনুমোদিত। ব্যয়ের হিসাবে যুক্ত হয়েছে।':'আবেদন বাতিল।')},
 sendNote(){const t=val('nt'),m=val('nm');if(!t||!m)return toast('শিরোনাম ও বার্তা দুটোই লিখুন।');S.notes.unshift({t,m,d:'এইমাত্র',u:1,k:'ann'});$('#nt').value='';$('#nm').value='';toast('সব ব্যবহারকারীকে নোটিফিকেশন পাঠানো হয়েছে (ডেমো)।')}
};
document.addEventListener('click',e=>{
 if(e.target.id==='scrim'){closeSheet();return}
 const t=e.target.closest('[data-a]');if(!t)return;
 const f=A[t.dataset.a];if(f)f(t.dataset.v);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='rphoto'&&t.files&&t.files[0]){const f=t.files[0];if(!f.type.startsWith('image/'))return toast('ছবির ফাইল বেছে নিন।');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,160,160);S.tmpPhoto=c.toDataURL('image/jpeg',.82);toast('ছবি বেছে নেওয়া হয়েছে।')};im.onerror=()=>toast('ছবিটি পড়া যায়নি। অন্য ছবি চেষ্টা করুন।');im.src=r.result};r.readAsDataURL(f);return}
 if(t.dataset.geo){ // dependent selects in forms
  const p=t.dataset.geo,div=$('#'+p+'div').value,dist=$('#'+p+'dist');
  if(t.id===p+'div'){dist.innerHTML=opts(div?Object.keys(GEO[div]):[],'','জেলা');$('#'+p+'upa').innerHTML=opts([],'','উপজেলা')}
  else $('#'+p+'upa').innerHTML=opts(div&&dist.value?GEO[div][dist.value]:[],'','উপজেলা');
 }
 const a=t.dataset.aChange;
 if(a==='sf'){const f=S.f;if(t.id==='sdiv'){f.div=t.value;f.dist='';f.upa=''}else if(t.id==='sdist'){f.dist=t.value;f.upa=''}else f.upa=t.value;render(true)}
 if(a==='rdist'){S.rankDist=t.value;render(true)}
 if(a==='af'){if(t.id==='adist'){S.ambF.dist=t.value;S.ambF.upa=''}else S.ambF.upa=t.value;render(true)}
});
function otpTick(){const b=$('#otpbtn');if(!b)return;b.disabled=(S.otpUntil||0)>Date.now();b.textContent=otpLabel()}
setInterval(otpTick,1000);
document.addEventListener('input',e=>{if(e.target.id==='lotp'){const v=e.target.value.replace(/\D/g,'');if(v.length===4){e.target.value=v;A.login()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='cmsg')A.send()});
render();
</script>
</body>
</html>
